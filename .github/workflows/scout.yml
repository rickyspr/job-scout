name: scout

# One run polls in a loop for ~5.5 h. The cron only acts as a watchdog: thanks to the
# concurrency group, a new run waits in the queue and starts as soon as the current one ends.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: scout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Check out state branch into state/
        run: |
          git config --global user.name "job-scout[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch origin state
            git worktree add state state
          else
            git worktree add --orphan -b state state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scout run --loop 330 --commit
